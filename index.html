<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joseph Iannone</title>
</head>
<body>
<h1>Joseph Iannone's website</h1>

<canvas id="goo" width="520" height="520" style="display:block;width:100%;max-width:520px;touch-action:none;cursor:grab"></canvas>
<p id="goo-fallback"></p>

<script type="module">
const canvas = document.getElementById('goo');
const fallback = document.getElementById('goo-fallback');

// The goo is a raymarched signed-distance field. The same field and
// shading exist twice below, once in WGSL for WebGPU and once in GLSL
// for the WebGL2 fallback; keep them in step when editing.
const WGSL = `
struct Uniforms {
  res   : vec2f,
  time  : f32,
  yaw   : f32,
  pitch : f32,
  pad0  : f32,
  pad1  : f32,
  pad2  : f32,
};
@group(0) @binding(0) var<uniform> u : Uniforms;

fn smin(a : f32, b : f32, k : f32) -> f32 {
  let h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

fn blob(p : vec3f, c : vec3f, r : f32) -> f32 {
  return length(p - c) - r;
}

// A small core with four blobs swinging out past it, welded by smin so
// they pull necks and lobes instead of reading as one convex lump.
fn map(p : vec3f) -> f32 {
  let t = u.time;
  var d = blob(p, vec3f(0.0, 0.0, 0.0), 0.42);
  d = smin(d, blob(p, vec3f(0.52 * sin(t * 0.90), 0.40 * cos(t * 1.10), 0.34 * sin(t * 0.70)), 0.30), 0.34);
  d = smin(d, blob(p, vec3f(0.50 * cos(t * 0.70), 0.46 * sin(t * 0.80 + 1.7), 0.32 * cos(t * 1.30)), 0.27), 0.34);
  d = smin(d, blob(p, vec3f(0.44 * sin(t * 1.30 + 2.4), 0.44 * cos(t * 0.60 + 0.9), 0.38 * sin(t * 0.90 + 1.1)), 0.24), 0.32);
  d = smin(d, blob(p, vec3f(0.38 * cos(t * 1.05 + 4.1), 0.50 * sin(t * 0.95 + 3.3), 0.30 * cos(t * 0.85 + 2.2)), 0.20), 0.30);
  // Two octaves of slow ripple, so the surface crawls like something wet.
  d = d + 0.055 * sin(7.0 * p.x + t * 1.4) * sin(7.0 * p.y + t * 1.1) * sin(7.0 * p.z + t * 0.9)
        + 0.020 * sin(12.0 * p.y - t * 1.7) * sin(12.0 * p.z + t * 1.2);
  return d;
}

fn normalAt(p : vec3f) -> vec3f {
  let e = vec2f(0.0015, 0.0);
  return normalize(vec3f(
    map(p + e.xyy) - map(p - e.xyy),
    map(p + e.yxy) - map(p - e.yxy),
    map(p + e.yyx) - map(p - e.yyx)));
}

fn march(ro : vec3f, rd : vec3f) -> f32 {
  var t = 0.6;
  for (var i = 0; i < 128; i++) {
    let d = map(ro + rd * t);
    if (d < 0.0012) { return t; }
    t = t + d * 0.6;   // understep: the ripple makes map() non-Lipschitz
    if (t > 8.0) { break; }
  }
  return -1.0;
}

fn ao(p : vec3f, n : vec3f) -> f32 {
  var occ = 0.0;
  var sca = 1.0;
  for (var i = 0; i < 5; i++) {
    let h = 0.02 + 0.11 * f32(i);
    occ = occ + (h - map(p + n * h)) * sca;
    sca = sca * 0.85;
  }
  return clamp(1.0 - 1.4 * occ, 0.0, 1.0);
}

// How much goo sits between this point and the light, for fake
// subsurface scattering: thin edges glow, thick middles stay dark.
fn thickness(p : vec3f, l : vec3f) -> f32 {
  var s = 0.0;
  for (var i = 1; i <= 4; i++) {
    let h = 0.12 * f32(i);
    s = s + clamp(-map(p + l * h) / h, 0.0, 1.0);
  }
  return clamp(s / 4.0, 0.0, 1.0);
}

// Dragging rotates the goo. Rather than rotating the field at every
// sample, rays are moved into the goo's own space and shaded there:
// dot products are rotation invariant, so only the sky term and the
// floor shadow need world space.
fn objectToWorld(yaw : f32, pitch : f32) -> mat3x3f {
  let cy = cos(yaw);
  let sy = sin(yaw);
  let cp = cos(pitch);
  let sp = sin(pitch);
  let ry = mat3x3f(vec3f(cy, 0.0, -sy), vec3f(0.0, 1.0, 0.0), vec3f(sy, 0.0, cy));
  let rx = mat3x3f(vec3f(1.0, 0.0, 0.0), vec3f(0.0, cp, sp), vec3f(0.0, -sp, cp));
  return ry * rx;
}

@vertex
fn vs(@builtin(vertex_index) vi : u32) -> @builtin(position) vec4f {
  var pts = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  return vec4f(pts[vi], 0.0, 1.0);
}

@fragment
fn fs(@builtin(position) frag : vec4f) -> @location(0) vec4f {
  let q = (frag.xy * 2.0 - u.res) / min(u.res.x, u.res.y);
  let uv = vec2f(q.x, -q.y);   // WebGPU reports this pixel with y pointing down

  let ro = vec3f(0.0, 0.30, 3.0);
  let fwd = normalize(vec3f(0.0, 0.0, 0.0) - ro);
  let right = normalize(cross(fwd, vec3f(0.0, 1.0, 0.0)));
  let up = cross(right, fwd);
  let rd = normalize(fwd * 1.9 + right * uv.x + up * uv.y);

  let l = normalize(vec3f(0.55, 0.85, 0.45));
  let R = objectToWorld(u.yaw, u.pitch);
  let Rt = transpose(R);
  let roo = Rt * ro;    // the same ray, seen from the goo's frame
  let rdo = Rt * rd;
  let lo = Rt * l;
  let t = march(roo, rdo);

  if (t < 0.0) {
    // Soft contact shadow on an invisible floor, so the goo has weight.
    if (rd.y < 0.0) {
      let tp = (-1.05 - ro.y) / rd.y;
      if (tp > 0.0) {
        let h = ro + rd * tp;
        let a = 0.28 * exp(-1.9 * dot(h.xz, h.xz)) * exp(-0.02 * tp * tp);
        return vec4f(vec3f(0.05, 0.13, 0.07) * a, a);
      }
    }
    return vec4f(0.0, 0.0, 0.0, 0.0);
  }

  let pos = roo + rdo * t;
  let n = normalAt(pos);
  let v = -rdo;
  let hv = normalize(lo + v);

  let dif = clamp(dot(n, lo), 0.0, 1.0);
  let amb = 0.5 + 0.5 * (R * n).y;                 // sky above, dark floor below
  let ndh = clamp(dot(n, hv), 0.0, 1.0);
  let tight = pow(ndh, 72.0);                      // wet pinpoint highlight
  let broad = pow(ndh, 10.0);                      // the sheen around it
  let fre = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 4.0);
  let occ = ao(pos, n);
  let back = clamp(dot(v, -lo), 0.0, 1.0);         // light pushing through toward the eye
  let thin = 1.0 - thickness(pos, lo);
  let sss = pow(thin, 2.0) * (0.35 + 0.65 * back);

  let deep = vec3f(0.012, 0.085, 0.030);
  let body = vec3f(0.075, 0.430, 0.130);
  let glow = vec3f(0.450, 0.950, 0.300);

  var col = mix(deep, body, dif) * occ;
  col = col + body * amb * 0.22 * occ;
  col = col + glow * sss * 0.45 * occ;
  col = col + vec3f(0.30, 0.80, 0.40) * fre * 0.38;
  col = col + vec3f(1.0, 1.0, 0.96) * (tight * 1.00 + broad * 0.10);
  // Cool fill from the left so the shadow side still reads as a surface.
  let fill = clamp(dot(n, Rt * normalize(vec3f(-0.7, 0.1, 0.35))), 0.0, 1.0);
  col = col + vec3f(0.06, 0.16, 0.12) * fill * occ;

  col = pow(clamp(col, vec3f(0.0), vec3f(1.0)), vec3f(1.0 / 2.2));
  return vec4f(col, 1.0);
}
`;

const GLSL_VERT = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)) * 2.0 - 1.0;
  gl_Position = vec4(p, 0.0, 1.0);
}
`;

const GLSL_FRAG = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform float uYaw;
uniform float uPitch;
out vec4 fragColor;

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float blob(vec3 p, vec3 c, float r) {
  return length(p - c) - r;
}

float map(vec3 p) {
  float t = uTime;
  float d = blob(p, vec3(0.0, 0.0, 0.0), 0.42);
  d = smin(d, blob(p, vec3(0.52 * sin(t * 0.90), 0.40 * cos(t * 1.10), 0.34 * sin(t * 0.70)), 0.30), 0.34);
  d = smin(d, blob(p, vec3(0.50 * cos(t * 0.70), 0.46 * sin(t * 0.80 + 1.7), 0.32 * cos(t * 1.30)), 0.27), 0.34);
  d = smin(d, blob(p, vec3(0.44 * sin(t * 1.30 + 2.4), 0.44 * cos(t * 0.60 + 0.9), 0.38 * sin(t * 0.90 + 1.1)), 0.24), 0.32);
  d = smin(d, blob(p, vec3(0.38 * cos(t * 1.05 + 4.1), 0.50 * sin(t * 0.95 + 3.3), 0.30 * cos(t * 0.85 + 2.2)), 0.20), 0.30);
  d = d + 0.055 * sin(7.0 * p.x + t * 1.4) * sin(7.0 * p.y + t * 1.1) * sin(7.0 * p.z + t * 0.9)
        + 0.020 * sin(12.0 * p.y - t * 1.7) * sin(12.0 * p.z + t * 1.2);
  return d;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(
    map(p + e.xyy) - map(p - e.xyy),
    map(p + e.yxy) - map(p - e.yxy),
    map(p + e.yyx) - map(p - e.yyx)));
}

float march(vec3 ro, vec3 rd) {
  float t = 0.6;
  for (int i = 0; i < 128; i++) {
    float d = map(ro + rd * t);
    if (d < 0.0012) { return t; }
    t = t + d * 0.6;
    if (t > 8.0) { break; }
  }
  return -1.0;
}

float ao(vec3 p, vec3 n) {
  float occ = 0.0;
  float sca = 1.0;
  for (int i = 0; i < 5; i++) {
    float h = 0.02 + 0.11 * float(i);
    occ = occ + (h - map(p + n * h)) * sca;
    sca = sca * 0.85;
  }
  return clamp(1.0 - 1.4 * occ, 0.0, 1.0);
}

float thickness(vec3 p, vec3 l) {
  float s = 0.0;
  for (int i = 1; i <= 4; i++) {
    float h = 0.12 * float(i);
    s = s + clamp(-map(p + l * h) / h, 0.0, 1.0);
  }
  return clamp(s / 4.0, 0.0, 1.0);
}

mat3 objectToWorld(float yaw, float pitch) {
  float cy = cos(yaw);
  float sy = sin(yaw);
  float cp = cos(pitch);
  float sp = sin(pitch);
  mat3 ry = mat3(vec3(cy, 0.0, -sy), vec3(0.0, 1.0, 0.0), vec3(sy, 0.0, cy));
  mat3 rx = mat3(vec3(1.0, 0.0, 0.0), vec3(0.0, cp, sp), vec3(0.0, -sp, cp));
  return ry * rx;
}

void main() {
  vec2 q = (gl_FragCoord.xy * 2.0 - uRes) / min(uRes.x, uRes.y);
  vec2 uv = q;   // gl_FragCoord already points y up, unlike WebGPU

  vec3 ro = vec3(0.0, 0.30, 3.0);
  vec3 fwd = normalize(vec3(0.0, 0.0, 0.0) - ro);
  vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(right, fwd);
  vec3 rd = normalize(fwd * 1.9 + right * uv.x + up * uv.y);

  vec3 l = normalize(vec3(0.55, 0.85, 0.45));
  mat3 R = objectToWorld(uYaw, uPitch);
  mat3 Rt = transpose(R);
  vec3 roo = Rt * ro;
  vec3 rdo = Rt * rd;
  vec3 lo = Rt * l;
  float tHit = march(roo, rdo);

  if (tHit < 0.0) {
    if (rd.y < 0.0) {
      float tp = (-1.05 - ro.y) / rd.y;
      if (tp > 0.0) {
        vec3 h = ro + rd * tp;
        float a = 0.28 * exp(-1.9 * dot(h.xz, h.xz)) * exp(-0.02 * tp * tp);
        fragColor = vec4(vec3(0.05, 0.13, 0.07) * a, a);
        return;
      }
    }
    fragColor = vec4(0.0, 0.0, 0.0, 0.0);
    return;
  }

  vec3 pos = roo + rdo * tHit;
  vec3 n = normalAt(pos);
  vec3 v = -rdo;
  vec3 hv = normalize(lo + v);

  float dif = clamp(dot(n, lo), 0.0, 1.0);
  float amb = 0.5 + 0.5 * (R * n).y;
  float ndh = clamp(dot(n, hv), 0.0, 1.0);
  float tight = pow(ndh, 72.0);
  float broad = pow(ndh, 10.0);
  float fre = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 4.0);
  float occ = ao(pos, n);
  float back = clamp(dot(v, -lo), 0.0, 1.0);
  float thin = 1.0 - thickness(pos, lo);
  float sss = pow(thin, 2.0) * (0.35 + 0.65 * back);

  vec3 deep = vec3(0.012, 0.085, 0.030);
  vec3 body = vec3(0.075, 0.430, 0.130);
  vec3 glow = vec3(0.450, 0.950, 0.300);

  vec3 col = mix(deep, body, dif) * occ;
  col = col + body * amb * 0.22 * occ;
  col = col + glow * sss * 0.45 * occ;
  col = col + vec3(0.30, 0.80, 0.40) * fre * 0.38;
  col = col + vec3(1.0, 1.0, 0.96) * (tight * 1.00 + broad * 0.10);
  float fill = clamp(dot(n, Rt * normalize(vec3(-0.7, 0.1, 0.35))), 0.0, 1.0);
  col = col + vec3(0.06, 0.16, 0.12) * fill * occ;

  col = pow(clamp(col, vec3(0.0), vec3(1.0)), vec3(1.0 / 2.2));
  fragColor = vec4(col, 1.0);
}
`;

async function initWebGPU() {
  if (!navigator.gpu) {
    throw new Error('no WebGPU');
  }
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) {
    throw new Error('no WebGPU adapter');
  }
  const device = await adapter.requestDevice();
  const context = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  context.configure({ device, format, alphaMode: 'premultiplied' });

  const module = device.createShaderModule({ code: WGSL });
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-list' },
  });
  const uniforms = device.createBuffer({
    size: 32,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });
  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: uniforms } }],
  });

  let lost = false;
  device.lost.then(() => { lost = true; });

  return {
    name: 'webgpu',
    isLost: () => lost,
    draw(time, yaw, pitch) {
      device.queue.writeBuffer(uniforms, 0,
        new Float32Array([canvas.width, canvas.height, time, yaw, pitch, 0, 0, 0]));
      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: { r: 0, g: 0, b: 0, a: 0 },
          loadOp: 'clear',
          storeOp: 'store',
        }],
      });
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.draw(3);
      pass.end();
      device.queue.submit([encoder.finish()]);
    },
  };
}

function initWebGL2() {
  const gl = canvas.getContext('webgl2', {
    alpha: true,
    premultipliedAlpha: true,
    antialias: false,
    depth: false,
    stencil: false,
  });
  if (!gl) {
    throw new Error('no WebGL2');
  }

  const compile = (type, source) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, source);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error('shader: ' + (gl.getShaderInfoLog(sh) || 'compile failed'));
    }
    return sh;
  };

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, GLSL_VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, GLSL_FRAG));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error('program: ' + (gl.getProgramInfoLog(program) || 'link failed'));
  }

  const vao = gl.createVertexArray();   // WebGL2 needs one bound even with no attributes
  const uRes = gl.getUniformLocation(program, 'uRes');
  const uTime = gl.getUniformLocation(program, 'uTime');
  const uYaw = gl.getUniformLocation(program, 'uYaw');
  const uPitch = gl.getUniformLocation(program, 'uPitch');

  return {
    name: 'webgl2',
    isLost: () => gl.isContextLost(),
    draw(time, yaw, pitch) {
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(program);
      gl.bindVertexArray(vao);
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, time);
      gl.uniform1f(uYaw, yaw);
      gl.uniform1f(uPitch, pitch);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    },
  };
}

async function start() {
  const reasons = [];
  let renderer = null;
  try {
    renderer = await initWebGPU();
  } catch (err) {
    reasons.push(err.message);
  }
  if (!renderer) {
    try {
      renderer = initWebGL2();   // iOS 15+, and every current Android browser
    } catch (err) {
      reasons.push(err.message);
    }
  }
  if (!renderer) {
    throw new Error(reasons.join(', '));
  }

  // Raymarching cost is per pixel, so the backing store gets a budget
  // rather than just devicePixelRatio: a phone at dpr 3 would otherwise
  // shade several times the pixels a desktop does.
  const PIXEL_BUDGET = 1000000;
  let quality = 1;
  let lastW = 0, lastH = 0, lastQuality = 0;

  function resize() {
    // Measuring forces layout, so only do it when something actually moved.
    if (window.innerWidth === lastW && window.innerHeight === lastH && quality === lastQuality) {
      return;
    }
    lastW = window.innerWidth;
    lastH = window.innerHeight;
    lastQuality = quality;

    canvas.style.width = '100%';        // let layout report the width available
    const available = Math.max(1, Math.round(canvas.clientWidth));
    // Keep it square, and short enough to sit on screen with the heading
    // even on a phone held sideways.
    const css = Math.max(200, Math.min(available, Math.round(window.innerHeight * 0.72)));
    canvas.style.width = css + 'px';
    canvas.style.height = css + 'px';

    let scale = Math.min(window.devicePixelRatio || 1, 2) * quality;
    if (css * css * scale * scale > PIXEL_BUDGET) {
      scale = Math.sqrt(PIXEL_BUDGET / (css * css));
    }
    const px = Math.max(1, Math.round(css * scale));
    if (canvas.width !== px || canvas.height !== px) {
      canvas.width = px;
      canvas.height = px;
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  // Drag to rotate. Pointer events cover mouse, touch and pen alike;
  // the canvas sets touch-action none so a vertical drag turns the goo
  // rather than scrolling the page.
  const RADIANS_PER_PIXEL = 0.008;
  const PITCH_LIMIT = 1.2;
  const GLIDE_DECAY = 0.85;
  const GLIDE_TAKEUP = 0.4;   // a flick coasts a little, it does not fly off
  const GLIDE_TIMEOUT = 80;   // ms: let go after holding still and it stays put
  let yaw = 0, pitch = 0;
  let spinYaw = 0, spinPitch = 0;
  let velYaw = 0, velPitch = 0;
  let dragging = false;
  let lastX = 0, lastY = 0, lastMove = 0;

  const clampPitch = (p) => Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, p));

  canvas.addEventListener('pointerdown', (event) => {
    dragging = true;
    spinYaw = 0;
    spinPitch = 0;
    velYaw = 0;
    velPitch = 0;
    lastX = event.clientX;
    lastY = event.clientY;
    lastMove = event.timeStamp;
    canvas.setPointerCapture(event.pointerId);
    canvas.style.cursor = 'grabbing';
  });

  canvas.addEventListener('pointermove', (event) => {
    if (!dragging) { return; }
    const dx = (event.clientX - lastX) * RADIANS_PER_PIXEL;
    const dy = (event.clientY - lastY) * RADIANS_PER_PIXEL;
    lastX = event.clientX;
    lastY = event.clientY;
    lastMove = event.timeStamp;
    yaw = yaw + dx;
    pitch = clampPitch(pitch + dy);
    // Smooth the recent motion rather than trusting one jittery move.
    velYaw = velYaw * 0.6 + dx * 0.4;
    velPitch = velPitch * 0.6 + dy * 0.4;
  });

  const endDrag = (event) => {
    if (!dragging) { return; }
    dragging = false;
    canvas.style.cursor = 'grab';
    const flicked = event.timeStamp - lastMove < GLIDE_TIMEOUT;
    spinYaw = flicked ? velYaw * GLIDE_TAKEUP : 0;
    spinPitch = flicked ? velPitch * GLIDE_TAKEUP : 0;
    if (canvas.hasPointerCapture(event.pointerId)) {
      canvas.releasePointerCapture(event.pointerId);
    }
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  const start = performance.now();
  let previous = start;
  let slowFrames = 0;
  let warmup = 20;

  function frame(now) {
    if (renderer.isLost()) { return; }

    // If the device can't hold a reasonable frame rate, shade fewer
    // pixels instead of letting the whole page judder.
    const dt = now - previous;
    previous = now;
    if (warmup > 0) {
      warmup--;
    } else if (dt > 26 && quality > 0.45) {
      slowFrames++;
      if (slowFrames > 30) {
        quality = Math.max(0.45, quality - 0.15);
        slowFrames = 0;
        warmup = 20;
      }
    } else {
      slowFrames = 0;
    }

    if (!dragging) {
      // Let a flick coast to a stop instead of stopping dead.
      yaw = yaw + spinYaw;
      pitch = clampPitch(pitch + spinPitch);
      spinYaw = Math.abs(spinYaw) < 1e-4 ? 0 : spinYaw * GLIDE_DECAY;
      spinPitch = Math.abs(spinPitch) < 1e-4 ? 0 : spinPitch * GLIDE_DECAY;
    }

    resize();
    renderer.draw((now - start) / 1000, yaw, pitch);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

start().catch((err) => {
  canvas.remove();
  fallback.textContent = 'The green goo needs WebGPU or WebGL2, which this browser did not provide (' + err.message + ').';
});
</script>
</body>

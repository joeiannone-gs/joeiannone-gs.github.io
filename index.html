<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mix it up</title>
<style>
    body { 
        font-family: Arial, sans-serif; 
        text-align: center; 
        margin: 0; 
        padding: 40px 20px; 
        color: #000;
        background: #fff;
    }
    h1 { 
        font-size: 5em; 
        font-weight: normal; 
        margin-bottom: 0.5em; 
        letter-spacing: -2px;
        text-transform: lowercase;
    }
    .btn-outline {
        border: 1px solid #000;
        background: #fff;
        padding: 12px 24px;
        font-size: 1.2em;
        cursor: pointer;
        text-decoration: none;
        color: #000;
        display: inline-block;
        margin-bottom: 50px;
        text-transform: lowercase;
    }
    .btn-outline:hover {
        background: #eee;
    }
    
    .event-options-container {
        text-align: left;
        max-width: 800px;
        margin: 0 auto;
    }

    /* Table alignment magic for continuity */
    table { 
        width: 100%; 
        border-collapse: collapse; 
        table-layout: fixed;
    }
    td:first-child, th:first-child { width: 75%; }
    td:last-child, th:last-child { width: 25%; text-align: right; }

    th {
        text-transform: lowercase;
    }

    /* Top Three Wrapper - Greyscale */
    .top-three-wrapper {
        background: #fff;
        border-radius: 12px;
        padding: 15px 10px 5px 10px;
        margin-bottom: 10px; 
        border: 2px solid #000; /* Pure greyscale border */
        display: none; 
    }
    .top-three-title {
        font-size: 1em;
        font-weight: bold;
        text-align: center;
        margin-bottom: 10px;
        color: #000; 
        text-transform: lowercase; /* Forced lowercase */
        letter-spacing: 1px;
    }
    
    #top-events-table tr:last-child td { border-bottom: none; }

    #event-table {
        margin-bottom: 50px;
    }
    
    td { 
        padding: 15px 10px; 
        font-size: 1em; 
        border-bottom: 1px solid #eee;
    }
    
    /* Accordion & Row Styling */
    .event-row { cursor: pointer; }
    .event-row:hover { background: #f3f3f3; }
    
    .event-title { 
        font-weight: bold; 
        font-size: 1.1em; 
        text-transform: lowercase; 
    }
    .time-stamp { 
        display: block; 
        font-size: 0.8em; 
        color: #666; 
        margin-top: 4px; 
        text-transform: lowercase;
    }
    
    .description-row { display: none; background: #f7f7f7; }
    .description-row td { padding: 0 15px 20px 15px; color: #444; border-bottom: 1px solid #eee; }
    
    .expand-arrow { display: inline-block; transition: transform 0.3s ease; font-size: 0.8em; margin-left: 8px; color: #888; }
    .expanded .description-row { display: table-row; }
    .expanded .expand-arrow { transform: rotate(180deg); }
    
    tbody.expanded .event-row td { border-bottom: none; }

    .center-btn-container { text-align: center; }

    /* Form styling */
    #add-event-form { 
        display: none; 
        margin-top: 15px; 
    }
    #add-event-form input[type="text"] { 
        padding: 10px; 
        font-size: 1.1em; 
        width: 100%; 
        max-width: 400px;
        margin: 0 auto 10px auto; 
        border: 1px solid #000; 
        display: block;
        text-transform: lowercase;
    }
    #add-event-form button { 
        padding: 10px 20px; 
        font-size: 1.1em; 
        cursor: pointer; 
        background: #000;
        color: #fff;
        border: 1px solid #000;
        text-transform: lowercase;
    }
    #add-event-form button:hover {
        background: #333;
    }
    
    /* Like Button Updates - Greyscale Theme */
    .like-btn {
        background: none;
        border: 1px solid #000;
        border-radius: 2px;
        cursor: pointer;
        padding: 4px 10px;
        margin-left: 10px;
        font-weight: bold;
        font-size: 1.1em;
        color: #000;
        transition: all 0.2s;
    }
    .like-btn:hover:not(:disabled) { background: #eee; }
    
    /* Styling for when the user has already voted - Solid Black */
    .like-btn.voted {
        background: #000;
        color: #fff;
        border-color: #000;
    }
    .like-btn:disabled {
        cursor: not-allowed;
        opacity: 0.5;
    }
</style>
</head>
<body>

    <h1>mix it up</h1>

    <a href="/about" class="btn-outline">learn how it works &gt;&gt;</a>

    <div class="event-options-container">

        <div id="top-three-wrapper" class="top-three-wrapper">
            <div id="countdown-display" class="top-three-title">calculating time remaining...</div>
            <table id="top-events-table">
                </table>
        </div>

        <table id="event-table">
            </table>

        <div class="center-btn-container">
            <button id="add-event-btn" class="btn-outline">add event</button>
            
            <div id="add-event-form">
                <input type="text" id="new-event-title" placeholder="event title (e.g. movie night)">
                <input type="text" id="new-event-text" placeholder="enter event details...">
                <button id="submit-event-btn">enter</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-analytics.js";

        // ==========================================
        // COUNTDOWN TARGET CONFIGURATION
        // Format: YYYY-MM-DDTHH:MM:SS-04:00 (Adjust the timezone offset as needed)
        // ==========================================
        const TARGET_DATE = "2026-04-23T17:00:00-04:00"; 

        const firebaseConfig = {
            apiKey: "AIzaSyBI_1847xtDLdHzf18ZVAPaeQC0JyKYrVs",
            authDomain: "mixitup-390a3.firebaseapp.com",
            projectId: "mixitup-390a3",
            storageBucket: "mixitup-390a3.firebasestorage.app",
            messagingSenderId: "1088562427057",
            appId: "1:1088562427057:web:64b7dd6a208df1968b1e90",
            measurementId: "G-XMJ8CE6XRM"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const addEventBtn = document.getElementById('add-event-btn');
        const addEventForm = document.getElementById('add-event-form');
        const submitEventBtn = document.getElementById('submit-event-btn');
        const newEventTitle = document.getElementById('new-event-title');
        const newEventText = document.getElementById('new-event-text');
        
        const topThreeWrapper = document.getElementById('top-three-wrapper');
        const topEventsTable = document.getElementById('top-events-table');
        const restEventsTable = document.getElementById('event-table');
        const countdownDisplay = document.getElementById('countdown-display');

        function startCountdown() {
            const targetTime = new Date(TARGET_DATE).getTime();

            const timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetTime - now;

                if (distance < 0) {
                    clearInterval(timerInterval);
                    countdownDisplay.innerText = "event chosen!";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                let displayStr = "next event chosen in: ";
                if (days > 0) displayStr += days + "d ";
                displayStr += hours + "h " + minutes + "m " + seconds + "s";

                countdownDisplay.innerText = displayStr;
            }, 1000);
        }

        function getLikedEvents() {
            return JSON.parse(localStorage.getItem('likedEvents') || '[]');
        }

        addEventBtn.addEventListener('click', () => {
            addEventBtn.style.display = 'none';
            addEventForm.style.display = 'block';
            newEventTitle.focus();
        });

        async function handleLike(eventId, likeBtn, ratingSpan) {
            let likedEvents = getLikedEvents();
            const isLiked = likedEvents.includes(eventId);
            const eventRef = doc(db, "events", eventId);

            try {
                likeBtn.disabled = true;

                if (isLiked) {
                    await updateDoc(eventRef, { rating: increment(-1) });
                    ratingSpan.innerText = parseInt(ratingSpan.innerText) - 1;
                    likedEvents = likedEvents.filter(id => id !== eventId);
                    likeBtn.classList.remove('voted');
                } else {
                    await updateDoc(eventRef, { rating: increment(1) });
                    ratingSpan.innerText = parseInt(ratingSpan.innerText) + 1;
                    likedEvents.push(eventId);
                    likeBtn.classList.add('voted');
                }

                localStorage.setItem('likedEvents', JSON.stringify(likedEvents));
                
            } catch (error) {
                console.error("error updating rating: ", error);
                alert("failed to update vote. please try again.");
            } finally {
                likeBtn.disabled = false;
            }
        }

        async function loadEvents() {
            try {
                const q = query(
                    collection(db, "events"), 
                    where("isActive", "==", true), 
                    orderBy("rating", "desc")
                );
                
                const querySnapshot = await getDocs(q);
                const likedEvents = getLikedEvents();
                
                // Clear tables 
                topEventsTable.innerHTML = '';
                restEventsTable.innerHTML = '';

                let count = 0;

                querySnapshot.forEach((docSnapshot) => {
                    count++;
                    const data = docSnapshot.data();
                    const eventId = docSnapshot.id;
                    const isLiked = likedEvents.includes(eventId);
                    
                    const eventDate = new Date(data.date);
                    const timeString = eventDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' @ ' + eventDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

                    const tbody = document.createElement('tbody');

                    tbody.innerHTML = `
                        <tr class="event-row">
                            <td>
                                <span class="event-title">${data.eventTitle || 'untitled event'} <span class="expand-arrow">▼</span></span>
                                <span class="time-stamp">submitted: ${timeString}</span>
                            </td>
                            <td>
                                <span class="rating-val">${data.rating || 0}</span>
                                <button class="like-btn ${isLiked ? 'voted' : ''}">▲</button>
                            </td>
                        </tr>
                        <tr class="description-row">
                            <td colspan="2">${data.eventDescription}</td>
                        </tr>
                    `;
                    
                    const mainRow = tbody.querySelector('.event-row');
                    const likeBtn = tbody.querySelector('.like-btn');
                    const ratingSpan = tbody.querySelector('.rating-val');
                    
                    mainRow.addEventListener('click', (e) => {
                        if (e.target.tagName === 'BUTTON') return; 
                        tbody.classList.toggle('expanded');
                    });

                    likeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        handleLike(eventId, likeBtn, ratingSpan);
                    });
                    
                    // Route to the correct table section
                    if (count <= 3) {
                        topEventsTable.appendChild(tbody);
                    } else {
                        restEventsTable.appendChild(tbody);
                    }
                });

                // Display logic based on amount of events
                if (count === 0) {
                    topThreeWrapper.style.display = 'none';
                } else {
                    topThreeWrapper.style.display = 'block';
                }

            } catch (e) {
                console.error("error fetching events: ", e);
                restEventsTable.innerHTML += '<tbody><tr><td colspan="2" style="text-align: center; color: red;">failed to load events. check console for details.</td></tr></tbody>';
            }
        }

        async function submitEvent() {
            const title = newEventTitle.value.trim();
            const text = newEventText.value.trim();
            
            if (!title || !text) {
                alert("please provide both a title and description.");
                return;
            }

            try {
                submitEventBtn.disabled = true;

                await addDoc(collection(db, "events"), {
                    date: new Date().toISOString(),
                    eventTitle: title,
                    eventDescription: text,
                    isActive: false, 
                    rating: 0
                });

                alert("event submitted successfully! it will appear on the board once approved.");
                
                newEventTitle.value = '';
                newEventText.value = '';
                addEventForm.style.display = 'none';
                addEventBtn.style.display = 'inline-block';
                
            } catch (e) {
                console.error("error adding document: ", e);
                alert("failed to save event. check console for details.");
            } finally {
                submitEventBtn.disabled = false;
            }
        }

        submitEventBtn.addEventListener('click', submitEvent);

        newEventText.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitEvent();
            }
        });

        // Initialize features
        startCountdown();
        loadEvents();
    </script>
</body>
</html>

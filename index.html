<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mix it up</title>
<style>
    body { 
        font-family: Arial, sans-serif; 
        text-align: center; 
        margin: 0; 
        padding: 40px 20px; 
        color: #000; 
    }
    h1 { 
        font-size: 5em; 
        font-weight: normal; 
        margin-bottom: 0.1em; 
        letter-spacing: -2px;
    }
    .next-event-title { 
        font-size: 1.8em; 
        margin-bottom: 0.2em; 
    }
    .next-event-details { 
        font-size: 1.8em; 
        margin-top: 0; 
        margin-bottom: 40px; 
    }
    .btn-outline {
        border: 4px solid black;
        background: white;
        padding: 12px 24px;
        font-size: 1.2em;
        cursor: pointer;
        text-decoration: none;
        color: black;
        display: inline-block;
        margin-bottom: 50px;
    }
    .event-options-container {
        text-align: left;
        max-width: 800px;
        margin: 0 auto;
    }
    .event-options-container h2 { 
        font-weight: normal; 
        font-size: 2em;
        margin-bottom: 10px; 
    }
    table { 
        width: 100%; 
        border-collapse: collapse; 
        margin-bottom: 50px; 
    }
    th { 
        text-align: left; 
        border-bottom: 1px solid black; 
        padding-bottom: 5px; 
        font-weight: normal; 
        font-size: 1em; 
    }
    .right-align { text-align: right; }
    td { 
        padding: 15px 0; 
        font-size: 1em; 
    }
    .center-btn-container { text-align: center; }

    /* Hidden by default */
    #add-event-form { 
        display: none; 
        margin-top: 15px; 
    }
    #add-event-form input[type="text"] { 
        padding: 10px; 
        font-size: 1.1em; 
        width: 60%; 
        max-width: 400px;
        margin-right: 10px; 
        border: 2px solid black; 
    }
    #add-event-form button { 
        padding: 10px 20px; 
        font-size: 1.1em; 
        cursor: pointer; 
        background: black;
        color: white;
        border: 2px solid black;
    }
</style>
</head>
<body>

    <h1>mix it up</h1>
    <p class="next-event-title">Next event:</p>
    <p class="next-event-details">April 25th 9:00 pm, Washington Square Park</p>

    <a href="/about" class="btn-outline">Learn how it works &gt;&gt;</a>

    <div class="event-options-container">
        <h2>Event options:</h2>
        <table>
            <thead>
                <tr>
                    <th>Event description</th>
                    <th class="right-align">%Likelihood</th>
                    <th class="right-align">good idea</th>
                    <th class="right-align">bad idea</th>
                </tr>
            </thead>
            <tbody id="event-list">
                <tr>
                    <td>April 25th 9:00 pm, Washington Square Park</td>
                    <td class="right-align">25%</td>
                    <td class="right-align"></td>
                    <td class="right-align"></td>
                </tr>
            </tbody>
        </table>

        <div class="center-btn-container">
            <button id="add-event-btn" class="btn-outline">Add event</button>
            
            <div id="add-event-form">
                <input type="text" id="new-event-text" placeholder="Enter event details...">
                <button id="submit-event-btn">Enter</button>
            </div>
        </div>
    </div>

    <script>
        const addEventBtn = document.getElementById('add-event-btn');
        const addEventForm = document.getElementById('add-event-form');
        const submitEventBtn = document.getElementById('submit-event-btn');
        const newEventText = document.getElementById('new-event-text');
        const eventList = document.getElementById('event-list');

        // Toggle text box visibility
        addEventBtn.addEventListener('click', () => {
            addEventBtn.style.display = 'none';
            addEventForm.style.display = 'block';
            newEventText.focus();
        });

        // Function to handle adding the event to the DOM
        function submitEvent() {
            const text = newEventText.value.trim();
            if (text) {
                const newRow = document.createElement('tr');
                newRow.innerHTML = `
                    <td>${text}</td>
                    <td class="right-align">--</td>
                    <td class="right-align"></td>
                    <td class="right-align"></td>
                `;
                eventList.appendChild(newRow);

                // Reset state
                newEventText.value = '';
                addEventForm.style.display = 'none';
                addEventBtn.style.display = 'inline-block';
            }
        }

        // Trigger submission on button click
        submitEventBtn.addEventListener('click', submitEvent);

        // Trigger submission when pressing the Enter key inside the text box
        newEventText.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitEvent();
            }
        });
    </script>
</body>
</html>

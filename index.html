<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mix it up</title>
<style>
    body { 
        font-family: Arial, sans-serif; 
        text-align: center; 
        margin: 0; 
        padding: 40px 20px; 
        color: #000; 
    }
    h1 { 
        font-size: 5em; 
        font-weight: normal; 
        margin-bottom: 0.1em; 
        letter-spacing: -2px;
    }
    .next-event-title { 
        font-size: 1.8em; 
        margin-bottom: 0.2em; 
    }
    .next-event-details { 
        font-size: 1.8em; 
        margin-top: 0; 
        margin-bottom: 40px; 
    }
    .btn-outline {
        border: 4px solid black;
        background: white;
        padding: 12px 24px;
        font-size: 1.2em;
        cursor: pointer;
        text-decoration: none;
        color: black;
        display: inline-block;
        margin-bottom: 50px;
    }
    .event-options-container {
        text-align: left;
        max-width: 800px;
        margin: 0 auto;
    }
    .event-options-container h2 { 
        font-weight: normal; 
        font-size: 2em;
        margin-bottom: 10px; 
    }
    table { 
        width: 100%; 
        border-collapse: collapse; 
        margin-bottom: 50px; 
    }
    th { 
        text-align: left; 
        border-bottom: 1px solid black; 
        padding-bottom: 5px; 
        font-weight: normal; 
        font-size: 1em; 
    }
    .right-align { text-align: right; }
    td { 
        padding: 15px 0; 
        font-size: 1em; 
    }
    .center-btn-container { text-align: center; }

    /* Hidden by default */
    #add-event-form { 
        display: none; 
        margin-top: 15px; 
    }
    #add-event-form input[type="text"] { 
        padding: 10px; 
        font-size: 1.1em; 
        width: 60%; 
        max-width: 400px;
        margin-right: 10px; 
        border: 2px solid black; 
    }
    #add-event-form button { 
        padding: 10px 20px; 
        font-size: 1.1em; 
        cursor: pointer; 
        background: black;
        color: white;
        border: 2px solid black;
    }
</style>
</head>
<body>

    <h1>mix it up</h1>
    <p class="next-event-title">Next event:</p>
    <p class="next-event-details">April 25th 9:00 pm, Washington Square Park</p>

    <a href="/about" class="btn-outline">Learn how it works &gt;&gt;</a>

    <div class="event-options-container">
        <h2>Event options:</h2>
        <table>
            <thead>
                <tr>
                    <th>Event description</th>
                    <th class="right-align">%Likelihood</th>
                    <th class="right-align">rating</th>
                </tr>
            </thead>
            <tbody id="event-list">
                <tr>
                    <td colspan="3" style="text-align: center;">Loading events...</td>
                </tr>
            </tbody>
        </table>

        <div class="center-btn-container">
            <button id="add-event-btn" class="btn-outline">Add event</button>
            
            <div id="add-event-form">
                <input type="text" id="new-event-text" placeholder="Enter event details...">
                <button id="submit-event-btn">Enter</button>
            </div>
        </div>
    </div>

    <script type="module">
        // 1. Firebase Imports (Added getDocs, query, orderBy)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-analytics.js";

        // 2. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBI_1847xtDLdHzf18ZVAPaeQC0JyKYrVs",
            authDomain: "mixitup-390a3.firebaseapp.com",
            projectId: "mixitup-390a3",
            storageBucket: "mixitup-390a3.firebasestorage.app",
            messagingSenderId: "1088562427057",
            appId: "1:1088562427057:web:64b7dd6a208df1968b1e90",
            measurementId: "G-XMJ8CE6XRM"
        };

        // 3. Initialize Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // 4. UI Element References
        const addEventBtn = document.getElementById('add-event-btn');
        const addEventForm = document.getElementById('add-event-form');
        const submitEventBtn = document.getElementById('submit-event-btn');
        const newEventText = document.getElementById('new-event-text');
        const eventList = document.getElementById('event-list');

        // Toggle text box visibility
        addEventBtn.addEventListener('click', () => {
            addEventBtn.style.display = 'none';
            addEventForm.style.display = 'block';
            newEventText.focus();
        });

        // Function to fetch and render events on page load
        async function loadEvents() {
            try {
                // Query the events collection, sort by date newest first
                const q = query(collection(db, "events"), orderBy("date", "desc"));
                const querySnapshot = await getDocs(q);
                
                // Clear the "Loading..." text
                eventList.innerHTML = '';

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Only display if the event is active
                    if (data.isActive) {
                        const newRow = document.createElement('tr');
                        newRow.innerHTML = `
                            <td>${data.eventDescription}</td>
                            <td class="right-align">--</td>
                            <td class="right-align">${data.rating}</td>
                        `;
                        eventList.appendChild(newRow);
                    }
                });
            } catch (e) {
                console.error("Error fetching events: ", e);
                eventList.innerHTML = '<tr><td colspan="3" style="text-align: center; color: red;">Failed to load events.</td></tr>';
            }
        }

        // Function to handle adding the event to Firebase and DOM
        async function submitEvent() {
            const text = newEventText.value.trim();
            
            if (text) {
                try {
                    submitEventBtn.disabled = true;

                    const docRef = await addDoc(collection(db, "events"), {
                        date: new Date().toISOString(),
                        eventDescription: text,
                        isActive: true,
                        rating: 0
                    });
                    
                    // Update the UI immediately without requiring a page refresh
                    const newRow = document.createElement('tr');
                    // Insert at the top of the list
                    newRow.innerHTML = `
                        <td>${text}</td>
                        <td class="right-align">--</td>
                        <td class="right-align">0</td>
                    `;
                    eventList.insertBefore(newRow, eventList.firstChild);

                    // Reset state
                    newEventText.value = '';
                    addEventForm.style.display = 'none';
                    addEventBtn.style.display = 'inline-block';
                    
                } catch (e) {
                    console.error("Error adding document: ", e);
                    alert("Failed to save event. Check console for details.");
                } finally {
                    submitEventBtn.disabled = false;
                }
            }
        }

        submitEventBtn.addEventListener('click', submitEvent);

        newEventText.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitEvent();
            }
        });

        // Initialize the app by fetching data
        loadEvents();
    </script>
</body>
</html>

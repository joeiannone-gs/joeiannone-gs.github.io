<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mix it up</title>
<style>
    body { 
        font-family: Arial, sans-serif; 
        text-align: center; 
        margin: 0; 
        padding: 40px 20px; 
        color: #000; 
    }
    h1 { 
        font-size: 5em; 
        font-weight: normal; 
        margin-bottom: 0.1em; 
        letter-spacing: -2px;
    }
    .next-event-title { 
        font-size: 1.8em; 
        margin-bottom: 0.2em; 
    }
    .next-event-details { 
        font-size: 1.8em; 
        margin-top: 0; 
        margin-bottom: 40px; 
    }
    .btn-outline {
        border: 4px solid black;
        background: white;
        padding: 12px 24px;
        font-size: 1.2em;
        cursor: pointer;
        text-decoration: none;
        color: black;
        display: inline-block;
        margin-bottom: 50px;
    }
    .event-options-container {
        text-align: left;
        max-width: 800px;
        margin: 0 auto;
    }
    .event-options-container h2 { 
        font-weight: normal; 
        font-size: 2em;
        margin-bottom: 10px; 
    }
    table { 
        width: 100%; 
        border-collapse: collapse; 
        margin-bottom: 50px; 
    }
    th { 
        text-align: left; 
        border-bottom: 1px solid black; 
        padding-bottom: 5px; 
        font-weight: normal; 
        font-size: 1em; 
    }
    .right-align { text-align: right; }
    td { 
        padding: 15px 0; 
        font-size: 1em; 
    }
    .center-btn-container { text-align: center; }

    /* Hidden by default */
    #add-event-form { 
        display: none; 
        margin-top: 15px; 
    }
    #add-event-form input[type="text"] { 
        padding: 10px; 
        font-size: 1.1em; 
        width: 60%; 
        max-width: 400px;
        margin-right: 10px; 
        border: 2px solid black; 
    }
    #add-event-form button { 
        padding: 10px 20px; 
        font-size: 1.1em; 
        cursor: pointer; 
        background: black;
        color: white;
        border: 2px solid black;
    }
    
    /* New styles for like button */
    .like-btn {
        background: none;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
        padding: 4px 8px;
        margin-left: 10px;
    }
    .like-btn:disabled {
        cursor: not-allowed;
        opacity: 0.5;
        background: #eee;
    }
</style>
</head>
<body>

    <h1>mix it up</h1>
    <p class="next-event-title">Next event:</p>
    <p class="next-event-details">April 25th 9:00 pm, Washington Square Park</p>

    <a href="/about" class="btn-outline">Learn how it works &gt;&gt;</a>

    <div class="event-options-container">
        <h2>Event options:</h2>
        <table>
            <thead>
                <tr>
                    <th>Event description</th>
                    <th class="right-align">%Likelihood</th>
                    <th class="right-align">rating</th>
                </tr>
            </thead>
            <tbody id="event-list">
                <tr>
                    <td colspan="3" style="text-align: center;">Loading events...</td>
                </tr>
            </tbody>
        </table>

        <div class="center-btn-container">
            <button id="add-event-btn" class="btn-outline">Add event</button>
            
            <div id="add-event-form">
                <input type="text" id="new-event-text" placeholder="Enter event details...">
                <button id="submit-event-btn">Enter</button>
            </div>
        </div>
    </div>

    <script type="module">
        // 1. Firebase Imports (Added doc, updateDoc, increment)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-analytics.js";

        // --- CONSTANTS ---
        const MAX_EVENT_LENGTH = 500;
        const RATE_LIMIT_MS = 10 * 60 * 1000; // 10 minutes in milliseconds
        const PROFANITY_LIST = [""]; // Update with actual words

        // 2. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBI_1847xtDLdHzf18ZVAPaeQC0JyKYrVs",
            authDomain: "mixitup-390a3.firebaseapp.com",
            projectId: "mixitup-390a3",
            storageBucket: "mixitup-390a3.firebasestorage.app",
            messagingSenderId: "1088562427057",
            appId: "1:1088562427057:web:64b7dd6a208df1968b1e90",
            measurementId: "G-XMJ8CE6XRM"
        };

        // 3. Initialize Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // 4. UI Element References
        const addEventBtn = document.getElementById('add-event-btn');
        const addEventForm = document.getElementById('add-event-form');
        const submitEventBtn = document.getElementById('submit-event-btn');
        const newEventText = document.getElementById('new-event-text');
        const eventList = document.getElementById('event-list');

        // Helper to check if user has liked an event
        function getLikedEvents() {
            return JSON.parse(localStorage.getItem('likedEvents') || '[]');
        }

        // Helper to check profanity
        function containsProfanity(text) {
            const lowerText = text.toLowerCase();
            // Uses word boundaries to avoid false positives (e.g. "scunthorpe")
            return PROFANITY_LIST.some(word => {
                const regex = new RegExp(`\\b${word}\\b`, 'i');
                return regex.test(lowerText);
            });
        }

        // Toggle text box visibility
        addEventBtn.addEventListener('click', () => {
            addEventBtn.style.display = 'none';
            addEventForm.style.display = 'block';
            newEventText.focus();
        });

        // Function to handle liking an event
        async function handleLike(eventId, likeBtn, ratingSpan) {
            const likedEvents = getLikedEvents();
            
            if (likedEvents.includes(eventId)) return;

            try {
                likeBtn.disabled = true;
                const eventRef = doc(db, "events", eventId);
                
                // Atomically increment the rating by 1
                await updateDoc(eventRef, {
                    rating: increment(1)
                });

                // Update UI and local storage
                ratingSpan.innerText = parseInt(ratingSpan.innerText) + 1;
                likedEvents.push(eventId);
                localStorage.setItem('likedEvents', JSON.stringify(likedEvents));
                
            } catch (error) {
                console.error("Error updating rating: ", error);
                likeBtn.disabled = false; // Re-enable if it failed
                alert("Failed to like the event. Please try again.");
            }
        }

        // Function to fetch and render events on page load
        async function loadEvents() {
            try {
                const q = query(collection(db, "events"), orderBy("date", "desc"));
                const querySnapshot = await getDocs(q);
                const likedEvents = getLikedEvents();
                
                eventList.innerHTML = '';

                querySnapshot.forEach((docSnapshot) => {
                    const data = docSnapshot.data();
                    const eventId = docSnapshot.id;
                    
                    if (data.isActive) {
                        const newRow = document.createElement('tr');
                        const isLiked = likedEvents.includes(eventId);
                        
                        newRow.innerHTML = `
                            <td>${data.eventDescription}</td>
                            <td class="right-align">--</td>
                            <td class="right-align">
                                <span class="rating-val">${data.rating || 0}</span>
                                <button class="like-btn" ${isLiked ? 'disabled' : ''}>👍</button>
                            </td>
                        `;
                        
                        const likeBtn = newRow.querySelector('.like-btn');
                        const ratingSpan = newRow.querySelector('.rating-val');
                        
                        likeBtn.addEventListener('click', () => handleLike(eventId, likeBtn, ratingSpan));
                        eventList.appendChild(newRow);
                    }
                });
            } catch (e) {
                console.error("Error fetching events: ", e);
                eventList.innerHTML = '<tr><td colspan="3" style="text-align: center; color: red;">Failed to load events.</td></tr>';
            }
        }

        // Function to handle adding the event to Firebase and DOM
        async function submitEvent() {
            const text = newEventText.value.trim();
            
            // --- VALIDATION FILTERS ---
            if (!text) return;

            if (text.length > MAX_EVENT_LENGTH) {
                alert(`Description rejected: Must be under ${MAX_EVENT_LENGTH} characters. Currently ${text.length}.`);
                return;
            }

            if (containsProfanity(text)) {
                alert("Description rejected: Inappropriate language detected.");
                return;
            }

            const lastSubmissionTime = localStorage.getItem('lastSubmissionTime');
            if (lastSubmissionTime && (Date.now() - parseInt(lastSubmissionTime) < RATE_LIMIT_MS)) {
                const minutesLeft = Math.ceil((RATE_LIMIT_MS - (Date.now() - parseInt(lastSubmissionTime))) / 60000);
                alert(`Submission rejected: Please wait ${minutesLeft} more minute(s) before submitting another event.`);
                return;
            }
            // --------------------------

            try {
                submitEventBtn.disabled = true;

                const docRef = await addDoc(collection(db, "events"), {
                    date: new Date().toISOString(),
                    eventDescription: text,
                    isActive: true,
                    rating: 0
                });
                
                // Update local storage for rate limiting
                localStorage.setItem('lastSubmissionTime', Date.now().toString());

                // Update the UI immediately
                const newRow = document.createElement('tr');
                newRow.innerHTML = `
                    <td>${text}</td>
                    <td class="right-align">--</td>
                    <td class="right-align">
                        <span class="rating-val">0</span>
                        <button class="like-btn">👍</button>
                    </td>
                `;
                
                const likeBtn = newRow.querySelector('.like-btn');
                const ratingSpan = newRow.querySelector('.rating-val');
                likeBtn.addEventListener('click', () => handleLike(docRef.id, likeBtn, ratingSpan));
                
                eventList.insertBefore(newRow, eventList.firstChild);

                // Reset state
                newEventText.value = '';
                addEventForm.style.display = 'none';
                addEventBtn.style.display = 'inline-block';
                
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Failed to save event. Check console for details.");
            } finally {
                submitEventBtn.disabled = false;
            }
        }

        submitEventBtn.addEventListener('click', submitEvent);

        newEventText.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitEvent();
            }
        });

        // Initialize the app by fetching data
        loadEvents();
    </script>
</body>
</html>
